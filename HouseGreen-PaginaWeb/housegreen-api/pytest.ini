# Paso 126: configuración de las pruebas automáticas (se corren con: pytest -v)
[pytest]
testpaths = tests
pythonpath = .
# Paso 127: cada prueba dice de qué tipo es. Para correr solo un tipo: pytest -v -m funcional
markers =
    funcional: prueba funcional (revisa QUÉ hace HouseGreen)
    no_funcional: prueba no funcional (revisa CÓMO lo hace: seguridad, rendimiento, fiabilidad)
addopts = --strict-markers
# Avisos de funciones antiguas de las librerías: no son errores de HouseGreen
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
