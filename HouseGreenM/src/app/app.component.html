<ion-app>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar class="menu-toolbar">
        <ion-title class="color">HouseGreen</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="cuerpo-menu">
      <ion-list>
        <ion-menu-toggle auto-hide="false">
          <ion-item [routerLink]="['/home']">
            <ion-icon aria-hidden="true" name="home-outline" slot="start"></ion-icon>
            <ion-label>Inicio</ion-label>
          </ion-item>

          <ion-item [routerLink]="['/catalogo']">
            <ion-icon aria-hidden="true" name="business-outline" slot="start"></ion-icon>
            <ion-label>Catálogo de Remates</ion-label>
          </ion-item>

          <ion-item [routerLink]="['/miperfil']">
            <ion-icon aria-hidden="true" name="person-outline" slot="start"></ion-icon>
            <ion-label>Mi Perfil</ion-label>
          </ion-item>

          <ion-item [routerLink]="['/nosotros']">
            <ion-icon aria-hidden="true" name="information-circle-outline" slot="start"></ion-icon>
            <ion-label>Nosotros</ion-label>
          </ion-item>

          <ion-item [routerLink]="['/contacto']">
            <ion-icon aria-hidden="true" name="call-outline" slot="start"></ion-icon>
            <ion-label>Contacto</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>

    <ion-footer class="menu-footer">
      <ion-menu-toggle auto-hide="false">
        <ion-item [routerLink]="['/login']">
          <ion-icon aria-hidden="true" name="exit-outline" slot="start" class="color"></ion-icon>
          <ion-label>Cerrar Sesión</ion-label>
        </ion-item>
      </ion-menu-toggle>
    </ion-footer>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
