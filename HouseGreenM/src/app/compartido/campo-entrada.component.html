<div class="login-grupo">
  <label class="login-label" [attr.for]="id">{{ etiqueta() }}</label>

  <div class="login-campo">
    <svg class="login-icono" viewBox="0 0 24 24" aria-hidden="true">
      @switch (icono()) {
        @case ('correo') {
          <svg:rect x="3" y="5" width="18" height="14" rx="2.5" />
          <svg:path d="m4 7.5 8 6 8-6" />
        }
        @case ('candado') {
          <svg:rect x="4.5" y="10.5" width="15" height="10" rx="2.5" />
          <svg:path d="M8 10.5V7.5a4 4 0 0 1 8 0v3" />
        }
        @case ('persona') {
          <svg:circle cx="12" cy="8" r="3.75" />
          <svg:path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" />
        }
        @case ('telefono') {
          <svg:rect x="7" y="2.5" width="10" height="19" rx="2.5" />
          <svg:path d="M11 18h2" />
        }
      }
    </svg>

    <input
      class="login-input"
      [id]="id"
      [type]="tipo()"
      [attr.autocomplete]="autocompletar()"
      [placeholder]="marcador()"
      [value]="valor()"
      (input)="escribir($event)" />

    @if (conOjo()) {
      <button
        type="button"
        class="login-ojo"
        [attr.aria-label]="visible() ? 'Ocultar la contraseña' : 'Mostrar la contraseña'"
        [attr.aria-pressed]="visible()"
        (click)="alternarVisible.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
          <circle cx="12" cy="12" r="3" />
          <!-- Con la contraseña a la vista, el ojo va tachado: al pulsarlo se oculta -->
          @if (visible()) {
            <svg:path d="M4 4l16 16" />
          }
        </svg>
      </button>
    }
  </div>

  @if (ayuda()) {
    <p class="login-ayuda">{{ ayuda() }}</p>
  }
</div>
