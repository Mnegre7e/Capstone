@if (datos(); as r) {
  <div class="detalle-seccion">
    <h2>Datos del remate</h2>

    @if (casillas().length > 0) {
      <div class="remate-datos">
        @for (casilla of casillas(); track casilla.etiqueta) {
          <div class="remate-dato">
            <p class="remate-dato-etiqueta">{{ casilla.etiqueta }}</p>
            <p class="remate-dato-valor">{{ casilla.valor }}</p>
          </div>
        }
      </div>
    }

    @for (bloque of textos(); track bloque.titulo) {
      <div class="remate-texto">
        <h3>{{ bloque.titulo }}</h3>
        <p>{{ bloque.texto }}</p>
      </div>
    }

    <!-- Paso 130: ya no se muestra el anuncio completo (puede traer nombres de personas):
         se lee en la publicación original, que enlaza el recuadro de abajo -->

  </div>

  <!-- Paso 130: de dónde vienen estos datos (antes era una línea "Fuente: Remates Inmobiliarios") -->
  <app-origen-datos [urlOriginal]="r.source_url"></app-origen-datos>
}
