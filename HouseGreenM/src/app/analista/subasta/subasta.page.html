<app-encabezado></app-encabezado>

<ion-content>
  <app-marco-reportes pantalla="subastas">
    @if (rep.reporte(); as reporte) {
      <app-rep-cifras [cifras]="cifras()"></app-rep-cifras>

      <app-rep-tarjeta [titulo]="'Remates publicados ' + CADA[reporte.agrupado_por].por">
        <app-rep-grafico [serie]="reporte.serie" medida="publicaciones" [agrupado]="reporte.agrupado_por"></app-rep-grafico>
      </app-rep-tarjeta>

      <app-rep-tarjeta titulo="Por semáforo">
        <app-rep-semaforo [semaforo]="reporte.publicaciones.semaforo"></app-rep-semaforo>
      </app-rep-tarjeta>

      <div class="rep-dos-columnas">
        <app-rep-tarjeta titulo="Por comuna">
          <app-rep-barras [filas]="reporte.subastas.por_comuna" [total]="reporte.subastas.vigentes" vacio="No hay remates vigentes."></app-rep-barras>
        </app-rep-tarjeta>
        <app-rep-tarjeta titulo="Por tipo de propiedad">
          <app-rep-barras [filas]="filasPorTipo()" [total]="reporte.subastas.vigentes" vacio="No hay remates vigentes."></app-rep-barras>
        </app-rep-tarjeta>
      </div>

      <p class="rep-nota">
        "Precio comparado" son los departamentos y casas cuyo precio inicial se comparó con el precio típico de su comuna
        (PropiedadesYa). En los demás remates el precio no suma puntos en el semáforo.
      </p>
    }
  </app-marco-reportes>
</ion-content>
