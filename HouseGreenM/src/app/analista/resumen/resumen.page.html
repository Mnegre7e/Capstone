<app-encabezado></app-encabezado>

<ion-content>
  <app-marco-reportes pantalla="resumen">
    @if (rep.reporte(); as reporte) {
      <app-rep-cifras [cifras]="cifras()"></app-rep-cifras>

      <app-rep-tarjeta [titulo]="CADA[reporte.agrupado_por].titulo">
        <app-rep-medidas [opciones]="OPCIONES" [(medida)]="medida"></app-rep-medidas>
        <app-rep-grafico [serie]="reporte.serie" [medida]="medida()" [agrupado]="reporte.agrupado_por"></app-rep-grafico>
      </app-rep-tarjeta>

      <app-rep-tarjeta titulo="Semáforo de los remates vigentes">
        <app-rep-semaforo [semaforo]="reporte.publicaciones.semaforo"></app-rep-semaforo>
      </app-rep-tarjeta>
    }
  </app-marco-reportes>
</ion-content>
