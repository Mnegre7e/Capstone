<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Contacto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cuerpo-contacto ion-padding">

  <div class="encabezado-contacto">
    <h2>¿Necesitas ayuda?</h2>
    <p>Contáctate con nuestro equipo de soporte e inversión.</p>
  </div>

  <ion-card class="card-contacto">
    <ion-card-content>
      <form (ngSubmit)="enviarFormulario()">
        <ion-item lines="full" class="item-input">
          <ion-icon name="person-outline" slot="start" color="success"></ion-icon>
          <ion-input 
            label="Nombre Completo" 
            labelPlacement="floating" 
            type="text" 
            [(ngModel)]="mensaje.nombre" 
            name="nombre" 
            required>
          </ion-input>
        </ion-item>

        <ion-item lines="full" class="item-input">
          <ion-icon name="mail-outline" slot="start" color="success"></ion-icon>
          <ion-input 
            label="Correo Electrónico" 
            labelPlacement="floating" 
            type="email" 
            [(ngModel)]="mensaje.email" 
            name="email" 
            required>
          </ion-input>
        </ion-item>

        <ion-item lines="full" class="item-input">
          <ion-icon name="help-circle-outline" slot="start" color="success"></ion-icon>
          <ion-input 
            label="Asunto" 
            labelPlacement="floating" 
            type="text" 
            [(ngModel)]="mensaje.asunto" 
            name="asunto" 
            required>
          </ion-input>
        </ion-item>

        <ion-item lines="full" class="item-input">
          <ion-icon name="chatbubble-ellipses-outline" slot="start" color="success"></ion-icon>
          <ion-textarea 
            label="Mensaje" 
            labelPlacement="floating" 
            rows="4" 
            [(ngModel)]="mensaje.contenido" 
            name="contenido" 
            required>
          </ion-textarea>
        </ion-item>

        <ion-button expand="block" type="submit" color="success" class="ion-margin-top boton-enviar">
          <ion-icon name="paper-plane-outline" slot="start"></ion-icon>
          Enviar Mensaje
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>

  <ion-list lines="none" class="lista-canales">
    <ion-item class="item-canal">
      <ion-icon name="call-outline" slot="start" color="success"></ion-icon>
      <ion-label>
        <h3>Teléfono Directo</h3>
        <p>+56 9 1234 5678</p>
      </ion-label>
    </ion-item>

    <ion-item class="item-canal">
      <ion-icon name="mail-unread-outline" slot="start" color="success"></ion-icon>
      <ion-label>
        <h3>Soporte General</h3>
        <p>contacto&#64;housegreen.cl</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
