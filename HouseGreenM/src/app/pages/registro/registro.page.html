<ion-content class="entrada-fondo">
  <app-marco-entrada>
    <form class="login-form" (ngSubmit)="crearCuenta()">
      <ion-back-button class="login-atras" text="Volver" icon="chevron-back" defaultHref="/login"></ion-back-button>
      <h1>Crear cuenta</h1>
      <p class="login-subtitle">Regístrate para ver los remates y guardar tus favoritos.</p>

      @if (error()) {
        <p class="login-error" role="alert">{{ error() }}</p>
      }

      <app-campo-entrada
        etiqueta="Nombre completo"
        icono="persona"
        autocompletar="name"
        marcador="Tu nombre completo"
        [(valor)]="nombre">
      </app-campo-entrada>

      <app-campo-entrada
        etiqueta="Correo electrónico"
        icono="correo"
        tipo="email"
        autocompletar="email"
        marcador="tucorreo@ejemplo.com"
        [(valor)]="correo">
      </app-campo-entrada>

      <app-campo-entrada
        etiqueta="Teléfono (opcional)"
        icono="telefono"
        tipo="tel"
        autocompletar="tel"
        marcador="+56 9 1234 5678"
        [(valor)]="telefono">
      </app-campo-entrada>

      <app-campo-entrada
        etiqueta="Contraseña"
        icono="candado"
        autocompletar="new-password"
        marcador="Mínimo 8 caracteres"
        [ayuda]="REGLA_CONTRASENA"
        [tipo]="mostrar() ? 'text' : 'password'"
        [conOjo]="true"
        [visible]="mostrar()"
        (alternarVisible)="mostrar.set(!mostrar())"
        [(valor)]="contrasenia">
      </app-campo-entrada>

      <app-campo-entrada
        etiqueta="Confirmar contraseña"
        icono="candado"
        autocompletar="new-password"
        marcador="••••••••"
        [tipo]="mostrar() ? 'text' : 'password'"
        [conOjo]="true"
        [visible]="mostrar()"
        (alternarVisible)="mostrar.set(!mostrar())"
        [(valor)]="repetida">
      </app-campo-entrada>

      <p class="login-legal">
        Al crear tu cuenta aceptas la <a [routerLink]="['/privacidad']">Política de privacidad</a>.
      </p>

      <button type="submit" class="login-button" [disabled]="guardando()">
        {{ guardando() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

      <p class="login-switch">¿Ya tienes cuenta? <a [routerLink]="['/login']">Inicia sesión</a></p>

      <p class="login-nota">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3 5 6v5.5c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9V6l-7-3Z" />
          <path d="m9 12 2.2 2.2L15 10.5" />
        </svg>
        Después podrás activar la verificación en dos pasos desde tu Perfil.
      </p>
    </form>
  </app-marco-entrada>
</ion-content>
