<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="light"></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil y Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cuerpo-perfil ion-padding">

  <div class="header-avatar ion-text-center">
    <div class="circulo-avatar">
      <ion-icon name="person-sharp"></ion-icon>
    </div>
    <h2>{{ usuario.nombre }}</h2>
    <ion-badge color="success" class="badge-rol">{{ usuario.tipoUsuario }}</ion-badge>
  </div>

  <ion-card class="card-info">
    <ion-card-header>
      <ion-card-title>Información Personal</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="full" class="lista-datos">
        <ion-item>
          <ion-icon name="card-outline" slot="start" color="success"></ion-icon>
          <ion-label>
            <p>RUT</p>
            <h3>{{ usuario.rut }}</h3>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="mail-outline" slot="start" color="success"></ion-icon>
          <ion-label>
            <p>Correo Electrónico</p>
            <h3>{{ usuario.email }}</h3>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="call-outline" slot="start" color="success"></ion-icon>
          <ion-label>
            <p>Teléfono de Contacto</p>
            <h3>{{ usuario.telefono }}</h3>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card class="card-opciones">
    <ion-list lines="none">
      <ion-item button (click)="irAFavoritos()" detail="true">
        <ion-icon name="heart-outline" slot="start" color="success"></ion-icon>
        <ion-label>Propiedades Guardadas</ion-label>
      </ion-item>

      <ion-item button detail="true">
        <ion-icon name="notifications-outline" slot="start" color="success"></ion-icon>
        <ion-label>Notificaciones</ion-label>
      </ion-item>

      <ion-item button detail="true">
        <ion-icon name="shield-checkmark-outline" slot="start" color="success"></ion-icon>
        <ion-label>Seguridad y Contraseña</ion-label>
      </ion-item>
    </ion-list>
  </ion-card>

  <ion-button expand="block" fill="outline" color="danger" class="btn-logout" (click)="cerrarSesion()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Cerrar Sesión
  </ion-button>

</ion-content>
