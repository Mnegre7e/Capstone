<ion-header class="ion-no-border">
  <ion-toolbar class="header-toolbar">
    <ion-buttons slot="start">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="cuerpo-home ion-padding">
  
  <!-- Banner de Bienvenida -->
  <ion-card class="card-bienvenida">
    <ion-card-header>
      <ion-card-subtitle>Bienvenido de vuelta</ion-card-subtitle>
      <ion-card-title>{{ usuario }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Encuentra las mejores oportunidades de inversión e inmuebles en remate hoy.
    </ion-card-content>
  </ion-card>

  <!-- Tarjetas de Acceso Rápido -->
  <div class="seccion-titulo">
    <h3>Accesos Rápidos</h3>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-card class="card-accion" [routerLink]="['/catalogo-propiedades']">
          <ion-card-content>
            <ion-icon name="business-outline" class="icono-card"></ion-icon>
            <h4>Catálogo</h4>
            <p>Ver remates</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card class="card-accion" [routerLink]="['/mapa-propiedades']">
          <ion-card-content>
            <ion-icon name="map-outline" class="icono-card"></ion-icon>
            <h4>Mapa</h4>
            <p>Ubicaciones</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card class="card-accion" [routerLink]="['/analisis-semaforo']">
          <ion-card-content>
            <ion-icon name="analytics-outline" class="icono-card"></ion-icon>
            <h4>Análisis</h4>
            <p>Semáforo</p>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="6">
        <ion-card class="card-accion" [routerLink]="['/propiedades-guardadas']">
          <ion-card-content>
            <ion-icon name="bookmark-outline" class="icono-card"></ion-icon>
            <h4>Guardados</h4>
            <p>Favoritos</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Botón Ubicación / Centro de Justicia -->
  <ion-card class="card-ubicacion" (click)="AbrirMaps()">
    <ion-item lines="none" class="item-maps">
      <ion-icon name="location-outline" slot="start" class="icono-ubicacion"></ion-icon>
      <ion-label>
        <h2>Centro de Justicia</h2>
        <p>Ver ubicación en Google Maps</p>
      </ion-label>
      <ion-icon name="open-outline" slot="end" color="medium"></ion-icon>
    </ion-item>
  </ion-card>

</ion-content>
