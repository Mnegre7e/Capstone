<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fondo transparente / adaptable -->
  <g transform="translate(0, 20)">
    
    <!-- Estructura Principal: Casa con doble borde estilo Chef -->
    <!-- Borde exterior claro / sombra suave -->
    <path d="M 250 50 
             L 390 170 
             A 15 15 0 0 1 395 185
             L 360 310 
             A 20 20 0 0 1 340 330
             L 160 330 
             A 20 20 0 0 1 140 310
             L 105 185 
             A 15 15 0 0 1 110 170
             Z" 
          fill="#E8F5E9" 
          stroke="#C8E6C9" 
          stroke-width="12" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Contorno principal de la casa (Verde Oscuro) -->
    <path d="M 250 75 
             L 365 175 
             L 340 295 
             L 160 295 
             L 135 175 
             Z" 
          fill="none" 
          stroke="#1B4332" 
          stroke-width="22" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Arco interior (Ventana/Puerta estilizada) -->
    <path d="M 200 295 
             V 220 
             A 50 50 0 0 1 300 220 
             V 295" 
          fill="none" 
          stroke="#1B4332" 
          stroke-width="18" 
          stroke-linecap="round"/>

    <!-- Elemento Inferior: Corbatín estilizado en forma de hojas -->
    <g transform="translate(250, 370)">
      <!-- Hoja Izquierda -->
      <path d="M -8 0 
               C -40 -35, -95 -25, -90 10 
               C -85 45, -35 30, -8 0 Z" 
            fill="#2E7D32" 
            stroke="#1B4332" 
            stroke-width="8" 
            stroke-linejoin="round"/>
      
      <!-- Hoja Derecha -->
      <path d="M 8 0 
               C 40 -35, 95 -25, 90 10 
               C 85 45, 35 30, 8 0 Z" 
            fill="#2E7D32" 
            stroke="#1B4332" 
            stroke-width="8" 
            stroke-linejoin="round"/>
            
      <!-- Nudo central -->
      <circle cx="0" cy="0" r="14" fill="#1B4332" />
    </g>

  </g>
</svg>
